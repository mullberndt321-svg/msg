<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrivacyTalk herunterladen</title>
<style>
  :root {
    --bg: #0f0a24;
    --panel: #1a1238;
    --panel-2: #231949;
    --line: rgba(167,139,250,.18);
    --text: #f1edff;
    --muted: #a99fd1;
    --accent: #8b5cf6;
    --accent-soft: #c4b5fd;
    --ok: #34d399;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f6f3ff; --panel: #ffffff; --panel-2: #ece6ff; --line: rgba(91,60,180,.18);
      --text: #1d1540; --muted: #62588c; --accent: #7c3aed; --accent-soft: #5b34c4; --ok: #059669;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: 16px; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.55;
  }
  .wrap { max-width: 920px; margin: 0 auto; padding: 48px 20px 64px; }
  header h1 { font-size: clamp(2rem, 6vw, 3.1rem); line-height: 1.1; margin: 0 0 12px; letter-spacing: -.02em; }
  header p { margin: 0; color: var(--muted); max-width: 52ch; font-size: 1.05rem; }
  .back { display: inline-block; margin-bottom: 28px; color: var(--accent-soft); text-decoration: none; font-size: .9rem; }
  .back:hover { text-decoration: underline; }

  .picker { display: grid; grid-template-columns: 260px 1fr; gap: 20px; margin-top: 36px; }
  @media (max-width: 720px) { .picker { grid-template-columns: 1fr; } }

  .platforms { display: flex; flex-direction: column; gap: 6px; }
  .platform {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    padding: 12px 14px; border-radius: 12px; border: 1px solid transparent;
    background: transparent; color: var(--text); font: inherit; cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .platform:hover { background: var(--panel); }
  .platform[aria-selected="true"] { background: var(--panel); border-color: var(--accent); }
  .platform:focus-visible, .dl:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }
  .platform svg { width: 24px; height: 24px; flex-shrink: 0; fill: currentColor; color: var(--accent-soft); }
  .platform .name { font-weight: 600; }
  .platform .tag { margin-left: auto; font-size: .72rem; padding: 2px 8px; border-radius: 99px; background: var(--panel-2); color: var(--muted); }
  .platform .tag.rec { background: rgba(52,211,153,.15); color: var(--ok); }

  .detail { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 28px; }
  .detail h2 { margin: 0 0 4px; font-size: 1.5rem; }
  .detail .sub { margin: 0 0 22px; color: var(--muted); }
  .dl {
    display: inline-flex; align-items: center; gap: 10px; padding: 13px 22px; border-radius: 12px;
    background: var(--accent); color: #fff; font-weight: 700; text-decoration: none; border: 0;
    transition: transform .15s, filter .15s;
  }
  .dl:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .dl svg { width: 18px; height: 18px; fill: currentColor; }
  .dl.off { background: var(--panel-2); color: var(--muted); pointer-events: none; }
  .file { margin: 12px 0 0; font-size: .85rem; color: var(--muted); }
  .steps { margin: 26px 0 0; padding: 20px 0 0 20px; border-top: 1px solid var(--line); color: var(--muted); }
  .steps li { margin-bottom: 8px; }
  .steps strong { color: var(--text); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 28px; }
  .top .back { margin: 0; }
  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .lang button { background: transparent; color: var(--muted); border: 0; padding: 6px 12px; font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer; }
  .lang button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .lang button:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: -3px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" id="backLink" href="https://privacytalk.pages.dev/"></a>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">English</button>
      <button type="button" data-lang="de">Deutsch</button>
      <button type="button" data-lang="ru">Русский</button>
    </div>
  </div>
  <header>
    <h1 id="title"></h1>
    <p id="intro"></p>
  </header>

  <div class="picker">
    <div class="platforms" role="tablist" id="platformList"></div>
    <section class="detail" id="detail" role="tabpanel" aria-live="polite"></section>
  </div>
</div>

<script>
/* ============ CONFIG / HIER ANPASSEN ============
   file: path to the file (relative to the site), e.g. "/download/PrivacyTalk.apk".
   file: null  ->  shown as "Coming soon". */
const PLATFORMS = [
  { id: "android", file: "/download/PrivacyTalk.apk" },
  { id: "windows", file: "/download/PrivacyTalk.exe" },
  { id: "mac", file: null },
  { id: "linux", file: null },
  { id: "ios", file: null }
];
/* ================================================ */

const TEXT = {
  en: {
    htmlTitle: "Download PrivacyTalk",
    back: "← Back to the messenger",
    title: "PrivacyTalk on every device",
    intro: "Pick your device and download the matching version.",
    listLabel: "Choose a platform",
    yourDevice: "Your device",
    soon: "Soon",
    comingSoon: "Coming soon",
    noVersion: "There is no version for this platform yet.",
    fileLabel: "File",
    platforms: {
      android: { name: "Android", sub: "For phones and tablets", btn: "Download APK",
        steps: ["Download the <strong>APK file</strong> and open it.", "If asked, allow <strong>installing from this source</strong>.", "Tap <strong>Install</strong> and open PrivacyTalk."] },
      windows: { name: "Windows PC", sub: "For Windows 10 and 11", btn: "Download for Windows",
        steps: ["Download the <strong>setup file</strong> and run it.", "If Windows shows a SmartScreen warning, choose <strong>More info → Run anyway</strong>.", "Follow the installer and start PrivacyTalk."] },
      mac: { name: "macOS", sub: "For Mac", btn: "Download for macOS", steps: [] },
      linux: { name: "Linux", sub: "For Linux desktops", btn: "Download for Linux", steps: [] },
      ios: { name: "iPhone / iPad", sub: "For iOS", btn: "Download for iOS", steps: [] }
    }
  },
  de: {
    htmlTitle: "PrivacyTalk herunterladen",
    back: "← Zurück zum Messenger",
    title: "PrivacyTalk auf jedem Gerät",
    intro: "Wähle dein Gerät aus und lade die passende Version herunter.",
    listLabel: "Plattform auswählen",
    yourDevice: "Dein Gerät",
    soon: "Bald",
    comingSoon: "Bald verfügbar",
    noVersion: "Für diese Plattform gibt es noch keine Version.",
    fileLabel: "Datei",
    platforms: {
      android: { name: "Android", sub: "Für Smartphones und Tablets", btn: "APK herunterladen",
        steps: ["Lade die <strong>APK-Datei</strong> herunter und öffne sie.", "Erlaube bei Nachfrage die <strong>Installation aus dieser Quelle</strong>.", "Tippe auf <strong>Installieren</strong> und öffne PrivacyTalk."] },
      windows: { name: "Windows PC", sub: "Für Windows 10 und 11", btn: "Für Windows herunterladen",
        steps: ["Lade die <strong>Setup-Datei</strong> herunter und starte sie.", "Zeigt Windows eine SmartScreen-Warnung, wähle <strong>Weitere Informationen → Trotzdem ausführen</strong>.", "Folge dem Installer und starte PrivacyTalk."] },
      mac: { name: "macOS", sub: "Für Mac", btn: "Für macOS herunterladen", steps: [] },
      linux: { name: "Linux", sub: "Für Linux-Desktops", btn: "Für Linux herunterladen", steps: [] },
      ios: { name: "iPhone / iPad", sub: "Für iOS", btn: "Für iOS herunterladen", steps: [] }
    }
  },
  ru: {
    htmlTitle: "Скачать PrivacyTalk",
    back: "← Назад в мессенджер",
    title: "PrivacyTalk на любом устройстве",
    intro: "Выберите устройство и скачайте подходящую версию.",
    listLabel: "Выберите платформу",
    yourDevice: "Ваше устройство",
    soon: "Скоро",
    comingSoon: "Скоро будет доступно",
    noVersion: "Для этой платформы пока нет версии.",
    fileLabel: "Файл",
    platforms: {
      android: { name: "Android", sub: "Для смартфонов и планшетов", btn: "Скачать APK",
        steps: ["Скачайте <strong>APK-файл</strong> и откройте его.", "При запросе разрешите <strong>установку из этого источника</strong>.", "Нажмите <strong>Установить</strong> и откройте PrivacyTalk."] },
      windows: { name: "Windows ПК", sub: "Для Windows 10 и 11", btn: "Скачать для Windows",
        steps: ["Скачайте <strong>установочный файл</strong> и запустите его.", "Если Windows показывает предупреждение SmartScreen, выберите <strong>Подробнее → Выполнить в любом случае</strong>.", "Следуйте установщику и запустите PrivacyTalk."] },
      mac: { name: "macOS", sub: "Для Mac", btn: "Скачать для macOS", steps: [] },
      linux: { name: "Linux", sub: "Для рабочих столов Linux", btn: "Скачать для Linux", steps: [] },
      ios: { name: "iPhone / iPad", sub: "Для iOS", btn: "Скачать для iOS", steps: [] }
    }
  }
};

const ICONS = {
  android: '<path d="M6 18c0 .55.45 1 1 1h1v3.5a1.5 1.5 0 003 0V19h2v3.5a1.5 1.5 0 003 0V19h1c.55 0 1-.45 1-1V8H6v10zM3.5 8A1.5 1.5 0 002 9.5v7a1.5 1.5 0 003 0v-7A1.5 1.5 0 003.5 8zm17 0A1.5 1.5 0 0019 9.5v7a1.5 1.5 0 003 0v-7A1.5 1.5 0 0020.5 8zM15.53 2.16l1.3-1.3a.5.5 0 00-.7-.71l-1.48 1.48A5.97 5.97 0 0012 1c-.96 0-1.86.23-2.66.63L7.85.15a.5.5 0 00-.7.71l1.31 1.31A5.97 5.97 0 006 7h12c0-2.1-1.08-3.95-2.47-4.84zM10 5H9V4h1v1zm5 0h-1V4h1v1z"/>',
  windows: '<path d="M3 5.5l8-1.1v7.1H3V5.5zm9-1.2L21 3v8.5h-9V4.3zM3 12.5h8v7.1l-8-1.1v-6zm9 0h9V21l-9-1.3v-7.2z"/>',
  mac: '<path d="M4 4h16a2 2 0 012 2v10a2 2 0 01-2 2h-6v2h3v2H7v-2h3v-2H4a2 2 0 01-2-2V6a2 2 0 012-2zm0 2v10h16V6H4z"/>',
  linux: '<path d="M4 4h16a2 2 0 012 2v12a2 2 0 01-2 2H4a2 2 0 01-2-2V6a2 2 0 012-2zm1.7 4.3L4.3 9.7 7.6 13l-3.3 3.3 1.4 1.4L10.4 13 5.7 8.3zM11 16v2h8v-2h-8z"/>',
  ios: '<path d="M8 1h8a2 2 0 012 2v18a2 2 0 01-2 2H8a2 2 0 01-2-2V3a2 2 0 012-2zm0 3v14h8V4H8zm4 15.2a1 1 0 100 2 1 1 0 000-2z"/>'
};
const DL_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10.2l3.6-3.6L17 11l-5 5-5-5 1.4-1.4L11 13.2V3h1zM5 18h14v2H5v-2z"/></svg>';

function detectPlatform() {
  const ua = navigator.userAgent || "";
  if (/android/i.test(ua)) return "android";
  if (/iphone|ipad|ipod/i.test(ua)) return "ios";
  if (/windows/i.test(ua)) return "windows";
  if (/macintosh|mac os x/i.test(ua)) return "mac";
  if (/linux|x11/i.test(ua)) return "linux";
  return "android";
}

// Gemeinsamer Speicher mit dem Messenger (gleiche Domain): Schlüssel "chatlio_settings_v1", Feld "lang"
const APP_SETTINGS_KEY = "chatlio_settings_v1";
function readAppSettings() {
  try { return JSON.parse(localStorage.getItem(APP_SETTINGS_KEY) || "{}") || {}; } catch (e) { return {}; }
}
function initialLang() {
  const app = readAppSettings().lang;
  if (app && TEXT[app]) return app;
  try { const saved = localStorage.getItem("tt_lang"); if (saved && TEXT[saved]) return saved; } catch (e) {}
  const nav = (navigator.language || "").slice(0, 2).toLowerCase();
  return TEXT[nav] ? nav : "en";
}
function saveLang(l) {
  try {
    const settings = readAppSettings();
    settings.lang = l;
    localStorage.setItem(APP_SETTINGS_KEY, JSON.stringify(settings));
    localStorage.setItem("tt_lang", l);
  } catch (e) {}
}

const detected = detectPlatform();
let current = detected;
let lang = initialLang();
const list = document.getElementById("platformList");
const detail = document.getElementById("detail");

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }

function render() {
  const t = TEXT[lang];
  document.documentElement.lang = lang;
  document.title = t.htmlTitle;
  document.getElementById("backLink").textContent = t.back;
  document.getElementById("title").textContent = t.title;
  document.getElementById("intro").textContent = t.intro;
  list.setAttribute("aria-label", t.listLabel);
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));

  list.innerHTML = PLATFORMS.map(p => `
    <button type="button" class="platform" role="tab" data-id="${p.id}" aria-selected="${p.id === current}">
      <svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[p.id]}</svg>
      <span class="name">${esc(t.platforms[p.id].name)}</span>
      ${p.id === detected ? `<span class="tag rec">${esc(t.yourDevice)}</span>` : (!p.file ? `<span class="tag">${esc(t.soon)}</span>` : "")}
    </button>`).join("");

  const p = PLATFORMS.find(x => x.id === current);
  const tx = t.platforms[p.id];
  const fileName = p.file ? p.file.split("/").pop() : "";
  detail.innerHTML = `
    <h2>${esc(tx.name)}</h2>
    <p class="sub">${esc(tx.sub)}</p>
    ${p.file
      ? `<a class="dl" href="${esc(p.file)}" download="${esc(fileName)}">${DL_ICON}${esc(tx.btn)}</a><p class="file">${esc(t.fileLabel)}: ${esc(fileName)}</p>`
      : `<span class="dl off">${esc(t.comingSoon)}</span><p class="file">${esc(t.noVersion)}</p>`}
    ${tx.steps.length && p.file ? `<ol class="steps">${tx.steps.map(x => `<li>${x}</li>`).join("")}</ol>` : ""}`;
}

list.addEventListener("click", e => {
  const b = e.target.closest(".platform");
  if (!b) return;
  current = b.dataset.id;
  render();
  list.querySelector('[aria-selected="true"]').focus();
});
document.querySelector(".lang").addEventListener("click", e => {
  const b = e.target.closest("button[data-lang]");
  if (!b) return;
  lang = b.dataset.lang;
  saveLang(lang);
  render();
});
// Sprache live übernehmen, wenn sie im Messenger (anderer Tab) geändert wird
window.addEventListener("storage", e => {
  if (e.key !== APP_SETTINGS_KEY) return;
  const l = readAppSettings().lang;
  if (l && TEXT[l] && l !== lang) { lang = l; render(); }
});
render();
</script>
</body>
</html>
